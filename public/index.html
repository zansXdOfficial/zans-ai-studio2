<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZANE AI Studio</title><style>body{margin:0;background:#070b15;color:#eef;font:16px system-ui;padding:40px}main{max-width:800px;margin:auto}textarea,input,button{padding:12px;margin:6px 0;border-radius:10px}textarea{width:100%;height:180px;background:#101827;color:white}button{background:#31e6ad;border:0;font-weight:800;cursor:pointer}img{max-width:100%;border-radius:16px;margin-top:20px}</style></head><body><main><h1>✦ ZANE AI Studio</h1><p>ChatGPT / OpenAI image studio • Watermark: ZANE OFC</p><textarea id="p" placeholder="Tulis prompt foto..."></textarea><br><button onclick="go()">Generate Foto</button><p id="s"></p><img id="o"></main><script>async function go(){s.textContent='Membuat gambar...';let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p.value})});let j=await r.json();if(!r.ok){s.textContent=j.error;return}o.src=j.image;s.textContent='Selesai — ZANE OFC';}</script></body></html>
